<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#2d2d2d" />
  
  <!-- Dashboard Frame -->
  <rect x="50" y="50" width="500" height="300" rx="5" fill="#1e1e1e" />
  
  <!-- Dashboard Header -->
  <rect x="50" y="50" width="500" height="40" rx="5" fill="#424242" />
  <rect x="70" y="65" width="150" height="15" rx="2" fill="#4dabf7" />
  <circle cx="520" cy="70" r="10" fill="#ff6584" />
  
  <!-- Dashboard Grid -->
  <rect x="70" y="110" width="220" height="110" rx="3" fill="#424242" />
  <rect x="310" y="110" width="220" height="110" rx="3" fill="#424242" />
  <rect x="70" y="240" width="220" height="90" rx="3" fill="#424242" />
  <rect x="310" y="240" width="220" height="90" rx="3" fill="#424242" />
  
  <!-- Chart 1: Bar Chart -->
  <rect x="90" y="140" width="20" height="60" rx="2" fill="#4dabf7" />
  <rect x="120" y="160" width="20" height="40" rx="2" fill="#4dabf7" />
  <rect x="150" y="130" width="20" height="70" rx="2" fill="#4dabf7" />
  <rect x="180" y="120" width="20" height="80" rx="2" fill="#4dabf7" />
  <rect x="210" y="150" width="20" height="50" rx="2" fill="#4dabf7" />
  <rect x="90" y="120" width="140" height="15" rx="2" fill="white" opacity="0.8" />
  
  <!-- Chart 2: Line Chart -->
  <polyline points="330,180 360,150 390,170 420,130 450,140 480,120" 
            fill="none" stroke="#ff6584" stroke-width="3" />
  <circle cx="330" cy="180" r="4" fill="#ff6584" />
  <circle cx="360" cy="150" r="4" fill="#ff6584" />
  <circle cx="390" cy="170" r="4" fill="#ff6584" />
  <circle cx="420" cy="130" r="4" fill="#ff6584" />
  <circle cx="450" cy="140" r="4" fill="#ff6584" />
  <circle cx="480" cy="120" r="4" fill="#ff6584" />
  <rect x="330" y="120" width="140" height="15" rx="2" fill="white" opacity="0.8" />
  
  <!-- Chart 3: Pie Chart -->
  <path d="M180,285 L180,240 A45,45 0 0,1 225,285 Z" fill="#4dabf7" />
  <path d="M180,285 L225,285 A45,45 0 0,1 180,330 Z" fill="#ff6584" />
  <path d="M180,285 L180,330 A45,45 0 0,1 135,285 Z" fill="#ffeb3b" />
  <path d="M180,285 L135,285 A45,45 0 0,1 180,240 Z" fill="#4caf50" />
  <rect x="90" y="250" width="80" height="15" rx="2" fill="white" opacity="0.8" />
  
  <!-- Chart 4: Data Table -->
  <rect x="330" y="260" width="180" height="15" rx="2" fill="#b3b3b3" />
  <rect x="330" y="280" width="180" height="15" rx="2" fill="#b3b3b3" />
  <rect x="330" y="300" width="180" height="15" rx="2" fill="#b3b3b3" />
  <rect x="330" y="250" width="100" height="15" rx="2" fill="white" opacity="0.8" />
</svg>