<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#2d2d2d" />
  
  <!-- Brand Identity Elements -->
  <!-- Logo Showcase -->
  <circle cx="150" cy="120" r="60" fill="#1e1e1e" />
  <path d="M120,120 L180,120 M150,90 L150,150" stroke="#4dabf7" stroke-width="8" stroke-linecap="round" />
  <circle cx="150" cy="120" r="20" fill="none" stroke="#ff6584" stroke-width="4" />
  
  <!-- Color Palette -->
  <rect x="250" y="80" width="50" height="50" rx="5" fill="#4dabf7" />
  <rect x="310" y="80" width="50" height="50" rx="5" fill="#ff6584" />
  <rect x="370" y="80" width="50" height="50" rx="5" fill="#ffeb3b" />
  <rect x="430" y="80" width="50" height="50" rx="5" fill="#4caf50" />
  <rect x="250" y="140" width="50" height="50" rx="5" fill="#212121" />
  <rect x="310" y="140" width="50" height="50" rx="5" fill="#424242" />
  <rect x="370" y="140" width="50" height="50" rx="5" fill="#616161" />
  <rect x="430" y="140" width="50" height="50" rx="5" fill="#b3b3b3" />
  
  <!-- Typography -->
  <rect x="100" y="220" width="150" height="30" rx="3" fill="#424242" />
  <rect x="110" y="230" width="130" height="10" rx="2" fill="#ffffff" />
  
  <rect x="100" y="260" width="120" height="20" rx="3" fill="#424242" />
  <rect x="110" y="265" width="100" height="10" rx="2" fill="#ffffff" opacity="0.8" />
  
  <rect x="100" y="290" width="180" height="15" rx="3" fill="#424242" />
  <rect x="110" y="292.5" width="160" height="10" rx="2" fill="#ffffff" opacity="0.6" />
  
  <!-- Brand Applications -->
  <!-- Business Card -->
  <rect x="300" y="220" width="100" height="60" rx="3" fill="#1e1e1e" />
  <rect x="310" y="230" width="40" height="10" rx="2" fill="#4dabf7" />
  <rect x="310" y="245" width="80" height="5" rx="1" fill="#b3b3b3" />
  <rect x="310" y="255" width="80" height="5" rx="1" fill="#b3b3b3" />
  <rect x="310" y="265" width="60" height="5" rx="1" fill="#b3b3b3" />
  
  <!-- Letterhead -->
  <rect x="420" y="220" width="80" height="100" rx="3" fill="#ffffff" />
  <rect x="430" y="230" width="30" height="10" rx="2" fill="#4dabf7" />
  <rect x="430" y="250" width="60" height="3" rx="1" fill="#212121" />
  <rect x="430" y="260" width="60" height="3" rx="1" fill="#212121" />
  <rect x="430" y="270" width="60" height="3" rx="1" fill="#212121" />
  <rect x="430" y="280" width="40" height="3" rx="1" fill="#212121" />
  
  <!-- Title -->
  <rect x="100" y="50" width="250" height="20" rx="3" fill="#4dabf7" />
  
  <!-- Subtitle -->
  <rect x="100" y="80" width="120" height="10" rx="2" fill="#b3b3b3" />
  
  <!-- Decorative Elements -->
  <circle cx="520" cy="350" r="20" fill="#ff6584" opacity="0.7" />
  <circle cx="80" cy="350" r="20" fill="#4dabf7" opacity="0.7" />
