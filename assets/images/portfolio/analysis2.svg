<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#2d2d2d" />
  
  <!-- UX Analysis Frame -->
  <rect x="50" y="50" width="500" height="300" rx="5" fill="#1e1e1e" />
  
  <!-- User Flow Diagram -->
  <!-- Nodes -->
  <circle cx="100" cy="150" r="30" fill="#424242" stroke="#4dabf7" stroke-width="2" />
  <circle cx="250" cy="100" r="30" fill="#424242" stroke="#4dabf7" stroke-width="2" />
  <circle cx="250" cy="200" r="30" fill="#424242" stroke="#4dabf7" stroke-width="2" />
  <circle cx="400" cy="150" r="30" fill="#424242" stroke="#4dabf7" stroke-width="2" />
  <circle cx="500" cy="150" r="30" fill="#424242" stroke="#4dabf7" stroke-width="2" />
  
  <!-- Connection Lines -->
  <line x1="130" y1="150" x2="220" y2="100" stroke="#b3b3b3" stroke-width="2" stroke-dasharray="5 3" />
  <line x1="130" y1="150" x2="220" y2="200" stroke="#b3b3b3" stroke-width="2" stroke-dasharray="5 3" />
  <line x1="280" y1="100" x2="370" y2="150" stroke="#b3b3b3" stroke-width="2" stroke-dasharray="5 3" />
  <line x1="280" y1="200" x2="370" y2="150" stroke="#b3b3b3" stroke-width="2" stroke-dasharray="5 3" />
  <line x1="430" y1="150" x2="470" y2="150" stroke="#b3b3b3" stroke-width="2" stroke-dasharray="5 3" />
  
  <!-- Node Icons -->
  <rect x="90" y="140" width="20" height="20" rx="2" fill="#4dabf7" />
  
  <path d="M245,95 L255,95 M250,90 L250,100" stroke="#ff6584" stroke-width="2" />
  <path d="M245,195 L255,195 M250,190 L250,200" stroke="#ff6584" stroke-width="2" />
  
  <circle cx="400" cy="150" r="15" fill="none" stroke="#ff6584" stroke-width="2" />
  
  <path d="M490,140 L510,160 M490,160 L510,140" stroke="#ff6584" stroke-width="2" />
  
  <!-- Heat Map -->
  <rect x="100" y="250" width="400" height="80" rx="3" fill="#424242" />
  
  <!-- Heat Map Gradient -->
  <rect x="120" y="270" width="50" height="40" rx="2" fill="#4dabf7" opacity="0.3" />
  <rect x="180" y="270" width="50" height="40" rx="2" fill="#4dabf7" opacity="0.5" />
  <rect x="240" y="270" width="50" height="40" rx="2" fill="#4dabf7" opacity="0.7" />
  <rect x="300" y="270" width="50" height="40" rx="2" fill="#ff6584" opacity="0.5" />
  <rect x="360" y="270" width="50" height="40" rx="2" fill="#ff6584" opacity="0.7" />
  <rect x="420" y="270" width="50" height="40" rx="2" fill="#ff6584" opacity="0.9" />
  
  <!-- Title -->
  <rect x="100" y="70" width="200" height="20" rx="3" fill="#4dabf7" />
  
  <!-- Subtitle -->
  <rect x="100" y="100" width="150" height="10" rx="2" fill="#b3b3b3" />
  
  <!-- Legend -->
  <rect x="400" y="70" width="15" height="15" rx="2" fill="#4dabf7" />
  <rect x="420" y="70" width="60" height="10" rx="2" fill="#b3b3b3" />
  
  <rect x="400" y="90" width="15" height="15" rx="2" fill="#ff6584" />
  <rect x="420" y="90" width="60" height="10" rx="2" fill="#b3b3b3" />
</svg>