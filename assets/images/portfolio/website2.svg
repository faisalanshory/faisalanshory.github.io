<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#2d2d2d" />
  
  <!-- Device Mockups -->
  <!-- Laptop -->
  <rect x="100" y="80" width="240" height="160" rx="5" fill="#1e1e1e" stroke="#424242" stroke-width="2" />
  <rect x="80" y="240" width="280" height="10" rx="2" fill="#424242" />
  <path d="M80,240 Q220,260 360,240" fill="#424242" />
  
  <!-- Tablet -->
  <rect x="400" y="120" width="120" height="160" rx="5" fill="#1e1e1e" stroke="#424242" stroke-width="2" />
  <circle cx="460" cy="260" r="8" fill="#424242" />
  
  <!-- Phone -->
  <rect x="400" y="50" width="60" height="100" rx="5" fill="#1e1e1e" stroke="#424242" stroke-width="2" />
  <rect x="425" y="60" width="10" height="5" rx="2" fill="#424242" />
  <circle cx="430" cy="140" r="5" fill="#424242" />
  
  <!-- Website Content on Laptop -->
  <rect x="110" y="90" width="220" height="140" fill="#212121" />
  
  <!-- Website Header -->
  <rect x="110" y="90" width="220" height="30" fill="#4dabf7" />
  <rect x="120" y="100" width="80" height="10" rx="2" fill="white" />
  <rect x="230" y="100" width="90" height="10" rx="2" fill="white" opacity="0.7" />
  
  <!-- Website Content -->
  <rect x="120" y="130" width="90" height="90" rx="3" fill="#424242" />
  <rect x="220" y="130" width="100" height="40" rx="3" fill="#424242" />
  <rect x="220" y="180" width="100" height="40" rx="3" fill="#424242" />
  
  <!-- Website Content on Tablet -->
  <rect x="410" y="130" width="100" height="140" fill="#212121" />
  <rect x="410" y="130" width="100" height="20" fill="#4dabf7" />
  <rect x="420" y="150" width="80" height="110" rx="3" fill="#424242" />
  
  <!-- Website Content on Phone -->
  <rect x="405" y="60" width="50" height="80" fill="#212121" />
  <rect x="405" y="60" width="50" height="15" fill="#4dabf7" />
  <rect x="410" y="80" width="40" height="50" rx="2" fill="#424242" />
  
  <!-- Responsive Design Text -->
  <rect x="150" y="290" width="300" height="20" rx="3" fill="#4dabf7" />
  <rect x="200" y="320" width="200" height="10" rx="2" fill="#b3b3b3" />
  <rect x="250" y="340" width="100" height="10" rx="2" fill="#b3b3b3" />
  
  <!-- Decorative Elements -->
  <circle cx="150" cy="340" r="10" fill="#ff6584" />
  <circle cx="450" cy="340" r="10" fill="#ff6584" />
</svg>