<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#2d2d2d" />
  
  <!-- Mobile App UI Design -->
  <!-- Phone Frame -->
  <rect x="150" y="50" width="300" height="300" rx="20" fill="#1e1e1e" stroke="#424242" stroke-width="2" />
  <rect x="160" y="60" width="280" height="280" rx="15" fill="#121212" />
  
  <!-- Status Bar -->
  <rect x="160" y="60" width="280" height="25" rx="5" fill="#212121" />
  <circle cx="180" cy="72.5" r="5" fill="#4dabf7" />
  <rect x="190" y="70" width="30" height="5" rx="2.5" fill="#b3b3b3" />
  <rect x="390" y="70" width="30" height="5" rx="2.5" fill="#b3b3b3" />
  
  <!-- App Header -->
  <rect x="160" y="85" width="280" height="40" fill="#212121" />
  <circle cx="180" cy="105" r="15" fill="#4dabf7" />
  <rect x="205" y="95" width="80" height="10" rx="2" fill="#ffffff" />
  <rect x="205" y="110" width="50" height="5" rx="1" fill="#b3b3b3" />
  <circle cx="420" cy="105" r="10" fill="none" stroke="#ff6584" stroke-width="2" />
  
  <!-- Navigation Tabs -->
  <rect x="160" y="300" width="280" height="40" fill="#212121" />
  <circle cx="200" cy="320" r="10" fill="#4dabf7" />
  <circle cx="260" cy="320" r="10" fill="#424242" />
  <circle cx="320" cy="320" r="10" fill="#424242" />
  <circle cx="380" cy="320" r="10" fill="#424242" />
  
  <!-- Content Area -->
  <!-- Fitness Stats Card -->
  <rect x="180" y="140" width="240" height="70" rx="10" fill="#424242" />
  <rect x="195" y="150" width="100" height="15" rx="2" fill="#ffffff" />
  <rect x="195" y="175" width="60" height="25" rx="3" fill="#4dabf7" />
  <rect x="265" y="175" width="60" height="25" rx="3" fill="#ff6584" />
  <rect x="335" y="175" width="60" height="25" rx="3" fill="#4caf50" />
  
  <!-- Activity Card -->
  <rect x="180" y="220" width="240" height="70" rx="10" fill="#424242" />
  <rect x="195" y="230" width="80" height="15" rx="2" fill="#ffffff" />
  
  <!-- Activity Graph -->
  <polyline points="195,265 215,255 235,260 255,245 275,250 295,240 315,245 335,235 355,240 375,230" 
            fill="none" stroke="#4dabf7" stroke-width="2" />
  <circle cx="195" cy="265" r="3" fill="#4dabf7" />
  <circle cx="215" cy="255" r="3" fill="#4dabf7" />
  <circle cx="235" cy="260" r="3" fill="#4dabf7" />
  <circle cx="255" cy="245" r="3" fill="#4dabf7" />
  <circle cx="275" cy="250" r="3" fill="#4dabf7" />
  <circle cx="295" cy="240" r="3" fill="#4dabf7" />
  <circle cx="315" cy="245" r="3" fill="#4dabf7" />
  <circle cx="335" cy="235" r="3" fill="#4dabf7" />
  <circle cx="355" cy="240" r="3" fill="#4dabf7" />
  <circle cx="375" cy="230" r="3" fill="#4dabf7" />
  
  <!-- Design Elements -->
  <circle cx="100" cy="100" r="15" fill="#ff6584" opacity="0.5" />
  <circle cx="100" cy="300" r="15" fill="#4dabf7" opacity="0.5" />
  <circle cx="500" cy="100" r="15" fill="#4dabf7" opacity="0.5" />
  <circle cx="500" cy="300" r="15" fill="#ff6584" opacity="0.5" />
  
  <!-- Title -->
  <rect x="150" y="360" width="300" height="20" rx="3" fill="#4dabf7" />
</svg>