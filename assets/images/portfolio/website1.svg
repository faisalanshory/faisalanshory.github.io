<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#2d2d2d" />
  
  <!-- Browser Window -->
  <rect x="50" y="50" width="500" height="300" rx="5" fill="#1e1e1e" />
  
  <!-- Browser Header -->
  <rect x="50" y="50" width="500" height="30" rx="5" fill="#424242" />
  
  <!-- Browser Controls -->
  <circle cx="70" cy="65" r="5" fill="#ff6584" />
  <circle cx="90" cy="65" r="5" fill="#ffeb3b" />
  <circle cx="110" cy="65" r="5" fill="#4dabf7" />
  
  <!-- URL Bar -->
  <rect x="130" y="55" width="300" height="20" rx="10" fill="#616161" />
  
  <!-- Website Content -->
  <rect x="70" y="100" width="200" height="40" rx="3" fill="#4dabf7" />
  
  <!-- Navigation Menu -->
  <rect x="350" y="100" width="180" height="10" rx="2" fill="#b3b3b3" />
  <rect x="350" y="120" width="180" height="10" rx="2" fill="#b3b3b3" />
  <rect x="350" y="140" width="180" height="10" rx="2" fill="#b3b3b3" />
  
  <!-- Hero Image -->
  <rect x="70" y="160" width="460" height="120" rx="3" fill="#424242" />
  
  <!-- Hero Text -->
  <rect x="100" y="190" width="200" height="20" rx="3" fill="white" />
  <rect x="100" y="220" width="150" height="10" rx="2" fill="#b3b3b3" />
  <rect x="100" y="240" width="100" height="20" rx="10" fill="#4dabf7" />
  
  <!-- Hero Graphic -->
  <circle cx="400" cy="220" r="40" fill="#ff6584" />
  <path d="M380,220 L420,220 M400,200 L400,240" stroke="white" stroke-width="4" />
  
  <!-- Footer -->
  <rect x="70" y="300" width="460" height="30" rx="3" fill="#424242" />
  <rect x="90" y="310" width="100" height="10" rx="2" fill="#b3b3b3" />
  <rect x="400" y="310" width="100" height="10" rx="2" fill="#b3b3b3" />
</svg>